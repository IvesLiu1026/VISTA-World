<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VISTA · Scenario Studio</title><style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#111519;color:#eff2f3}*{box-sizing:border-box}body{max-width:1000px;margin:0 auto;padding:28px 20px}header,.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:30px}h1{font-size:23px;margin:0}a{color:#a9ced7;text-decoration:none}label{font-size:14px;color:#aebbc1}textarea{font:inherit;width:100%;min-height:140px;resize:vertical;background:#1a2228;border:1px solid #35434c;color:inherit;padding:18px;border-radius:12px;line-height:1.6}button,select,input{font:inherit;border:1px solid #3d505c;border-radius:8px;padding:10px 14px;background:#202d35;color:inherit}button{cursor:pointer}button.primary{background:#b7e4d7;color:#142520;font-weight:700}button:disabled{opacity:.4;cursor:default}input{width:100px}.bar{margin:14px 0}.example{font-size:14px;color:#b5c7d0;background:none;border-style:dashed}#status{min-height:24px;color:#b7e4d7}#error{color:#ffafa4;white-space:pre-wrap}.card{background:#192127;border:1px solid #2b3a43;border-radius:12px;padding:18px;margin-top:18px}.card p{margin:0 0 14px}ol{margin:12px 0;padding-left:24px;color:#bfcbd1;line-height:1.8}li.active{color:#b7e4d7;font-weight:600}.muted{color:#93a6af;font-size:13px}#library{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.small{font-size:13px;padding:8px 10px}#library .card{margin:0}.hidden{display:none}footer{margin:24px 0;color:#83959f;font-size:13px}
</style><header><h1>VISTA · Scenario Studio</h1><nav><a href="/themes">場景與影片</a> · <a href="/">與 Assistant 對話</a></nav></header>
<textarea id="prompt" maxlength="1600" aria-label="場景與演出描述" placeholder="描述房間、人物要做的事，以及同時發生的事件…">建立暖光深木色的小書房。讓人走到電話旁，拿起電話接聽，說「I'll call you after the meeting.」，掛斷後走到窗邊。</textarea>
<div class="bar"><button class="example" data-example="micro">書房通話</button><button class="example" data-example="home">廚房提醒</button><button class="example" data-example="concurrent">電話與浴室事件</button></div>
<div class="bar"><label>變化 <input id="seed" type="number" value="0" min="0" max="999999"></label><button class="primary" id="compile">生成場景與劇本</button><button id="stop">停止演出／準備</button></div>
<div id="status" role="status"></div><div id="error" role="alert"></div>
<section id="preview" class="card hidden"><p id="summary"></p><div class="bar"><select id="view" aria-label="固定視角"><option value="first">第一人稱</option><option value="third">第三人稱</option></select><button class="primary" id="play">開始演出</button></div><ol id="steps"></ol><p class="muted" id="events"></p><span class="muted" id="timing"></span></section>
<div id="library"></div><footer>在 Moonlight「VISTA Six Rooms Live AI」觀看。停止演出後可用 WASD／滑鼠接手。英文男聲；Assistant 自行回應。</footer>
<script>
const TOKEN='__TOKEN__', $=s=>document.getElementById(s);let selected=null,state=null,lastLibrary='',lastReady='';
const examples={micro:'建立暖光深木色的小書房。讓人走到電話旁，拿起電話接聽，說「I\'ll call you after the meeting.」，掛斷後走到窗邊。',home:'從六個房間的廚房開始。爐子一開始就沒關。人看著爐子，說「I\'m heading out soon.」，等待 10 秒，再請旁邊的 Assistant 幫忙關掉爐子，等 20 秒。',concurrent:'在現有六個房間裡，從臥室開始。人走到電話旁拿起接聽，對電話說「I am on my way.」。浴室水龍頭在第 5 秒開始忘記關。人一邊拿電話一邊走到浴室，看浴缸，等待 15 秒，掛斷電話，再請 Assistant 幫忙關掉浴室水龍頭，等 20 秒。'};
const names={walk:'走到',look:'看向',pickup_phone:'拿起電話',answer_phone:'接聽電話',hangup_phone:'掛斷電話',say:'說話',wait:'等待'};
const targets={center:'房間入口',window:'窗邊',phone:'電話旁',entry_hall:'玄關',living_room:'客廳',kitchen_dining:'廚房',bedroom:'臥室',office:'辦公室',bathroom_laundry:'浴室',stove:'爐子',faucet:'水龍頭',bathtub:'浴缸',keys:'鑰匙',none:''};
const statuses={compiling:'正在整理劇本…',voicing:'正在準備英文男聲…',ready:'準備好了，選擇視角後開始。',starting:'正在載入場景…',running:'演出中',completed:'演出完成，可以接手操作或重播。',stopping:'正在停止…',stopped:'已停止。',failed:'這次未完成。',unsupported:'這個要求目前不支援。'};
async function post(path,body={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Vista-Token':TOKEN},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d;}
function error(e){$('error').textContent=e.message;}
function description(row){return (row.micro?({'study':'小書房','lounge':'小客廳','bedroom':'小臥室'})[row.micro.family]+' · '+({'warm':'暖光','daylight':'日光'})[row.micro.lighting]:'六房間 · 從'+targets[row.scenario.start_room]+'開始')+' · '+row.scenario.steps.length+' 個步驟';}
function show(row){selected=row.id;$('preview').classList.remove('hidden');$('summary').textContent='劇本：'+description(row);$('steps').replaceChildren();row.scenario.steps.forEach((s,i)=>{const li=document.createElement('li');li.dataset.index=i;li.textContent=s.skill==='say'?(s.speaker==='phone'?'電話另一端：':'人物：')+s.line:names[s.skill]+(targets[s.target]||'')+(s.seconds?' '+s.seconds+' 秒':'');$('steps').append(li);});$('events').textContent=row.scenario.events.map(e=>e.at_s+' 秒：'+({'mmg_001':'爐子未關','mmg_021':'浴室流水','mmg_044':'找鑰匙'})[e.id]).join(' · ');$('timing').textContent='劇本 '+Math.round(row.compiler_ms)+' ms · Jev 場景選擇 '+Math.round(row.scene_ms)+' ms';}
async function refresh(){try{const r=await fetch('/state'),d=await r.json();if(!r.ok)throw Error('狀態讀取失敗');state=d.director;const j=state.job||{},busy=['compiling','voicing','starting','running','stopping'].includes(j.status);$('compile').disabled=busy;$('play').disabled=busy||!selected;$('stop').disabled=!busy;$('status').textContent=statuses[j.status]||'描述你想要的場景與人物行為。';$('error').textContent=j.error||(j.status==='unsupported'?j.explanation:'');const current=state.items.find(x=>x.id===j.id);if(current&&j.status==='ready'&&lastReady!==j.id){lastReady=j.id;show(current);}for(const li of $('steps').children)li.classList.toggle('active',j.status==='running'&&j.id===selected&&Number(li.dataset.index)===j.step);const ids=state.items.map(x=>x.id).join();if(ids!==lastLibrary){lastLibrary=ids;$('library').replaceChildren();for(const row of state.items){const card=document.createElement('section');card.className='card';const p=document.createElement('p');p.textContent=description(row);const b=document.createElement('button');b.className='small';b.textContent='查看／重播';b.onclick=()=>show(row);card.append(p,b);$('library').append(card);}}}catch(e){error(e);}}
$('compile').onclick=async()=>{try{$('error').textContent='';await post('/director/compile',{prompt:$('prompt').value,seed:Number($('seed').value)});await refresh();}catch(e){error(e);}};
$('play').onclick=async()=>{try{await post('/director/play',{id:selected,view:$('view').value});await refresh();}catch(e){error(e);}};
$('stop').onclick=async()=>{try{await post('/director/stop');await refresh();}catch(e){error(e);}};
for(const b of document.querySelectorAll('[data-example]'))b.onclick=()=>{$('prompt').value=examples[b.dataset.example];};refresh();setInterval(refresh,1500);
</script></html>
