<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VISTA · 日常情境</title><style>
*{box-sizing:border-box}body{margin:0;background:#101919;color:#eef7f0;font:16px system-ui;line-height:1.5}main{max-width:1200px;margin:auto;padding:30px 22px}a{color:#c6eb88;text-decoration:none}header,.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:34px;margin:16px 0}p{margin:8px 0}button,select,input,textarea{font:inherit;border:1px solid #47635a;border-radius:9px;padding:10px 14px;background:#233b33;color:#eef7f0}button{cursor:pointer}button.primary{background:#c6eb88;color:#122716;border-color:#c6eb88}button:disabled{opacity:.5;cursor:wait}button:hover{filter:brightness(1.15)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:24px}.card{border:1px solid #30473d;border-radius:16px;overflow:hidden;background:#182820}.image{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#354739,#182c28)}.image img{width:100%;height:100%;object-fit:cover}.image h2{position:absolute;bottom:0;left:0;right:0;margin:0;padding:40px 18px 16px;background:linear-gradient(transparent,#0b1817ed);font-size:23px}.actions{padding:12px 16px;display:flex;justify-content:space-between;gap:10px}section{margin:35px 0;padding:24px;border:1px solid #30473d;border-radius:16px}section h2{margin-top:0}textarea{width:100%;height:94px;margin:12px 0}input[type=number]{width:145px}small{color:#aec1b5}.variants{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.variant{max-width:320px;text-align:left}.variant span{display:block;color:#b1c6b7;font-size:13px}#status{min-height:24px;color:#c6eb88}#error{color:#ffb9ad;white-space:pre-wrap}dialog{padding:0;border:1px solid #507461;border-radius:16px;background:#10221a;color:#fff;width:min(1100px,95vw)}dialog::backdrop{background:#000d}dialog video{display:block;width:100%}.dialogbar{padding:12px;display:flex;justify-content:space-between}details{margin-top:20px;color:#aec1b5}pre{white-space:pre-wrap;font-size:13px;max-height:250px;overflow:auto}@media(max-width:680px){.grid{grid-template-columns:1fr}main{padding:20px 14px}section{padding:18px}h1{font-size:28px}.actions button{padding:9px 12px}}
</style><main><header><a href="/">← VISTA Live</a><a href="/demo">完整對話影片</a></header>
<div class="bar"><h1>10 種日常</h1><select id="view" aria-label="影片視角"><option value="first">第一人稱</option><option value="third">第三人稱</option></select></div>
<div id="status" role="status">連線中…</div><p id="error" role="alert"></p><div id="cards" class="grid"></div>
<section><div class="bar"><h2>建立一個小空間</h2><select id="theme" aria-label="空間主題"></select></div>
<textarea id="prompt" aria-label="小空間描述"></textarea>
<div class="bar"><label>變體 <input type="number" id="seed" value="21" min="0" max="2147483637"></label><div><button id="generate" class="primary">建立並進入</button> <button id="next">下一個變體</button></div></div>
<div><button id="batch">準備 10 個變體</button> <button id="stop">停止產生</button> <button id="opening">播放主題開場對話</button></div>
<div id="variants" class="variants"></div>
<details><summary>研究紀錄</summary><p>小空間使用現有材質與家具組裝，可走動、拿取鑰匙與手機；客廳和書房另有杯子。併發爐火／浴缸事件在上方六房主題中測試。Jev 選配置；引擎檢查通道與支撐。每輪最多 10 個，已完成的配置會保存。現有 3 種家具組合、3 種地板外觀、2 種燈光、3 種擺法，共 54 種配置；深色木地板是橡木貼圖調色，種子不會產生新模型。</p><pre id="debug"></pre></details></section>
</main><dialog id="player"><div class="dialogbar"><span id="videoTitle"></span><button id="close">關閉</button></div><video id="video" controls playsinline></video></dialog>
<script>
const $=id=>document.getElementById(id),token='__TOKEN__';let state={},catalogue=[],rendered='',busy=false;
async function post(path,body={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Vista-Token':token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function getState(){const r=await fetch('/state');if(!r.ok)throw Error('尚未連線');return await r.json()}
async function action(fn){if(busy)return;busy=true;$('error').textContent='';try{await fn()}catch(e){$('error').textContent=e.message}finally{busy=false}}
async function build(theme,seed,mode,count=1,enter=false){$('status').textContent='準備新情境…';const x=await post('/forge/generate',{theme,seed,mode,count,prompt:mode==='micro'?$('prompt').value:''});if(!enter)return;
const id=x.job.id;let g;for(let i=0;i<240;i++){const s=await getState();g=s.forge;if(g.job.id!==id)throw Error('已切換至另一個生成工作');if(['complete','failed','stopped'].includes(g.job.status))break;await new Promise(r=>setTimeout(r,500))}
if(g.job.status!=='complete')throw Error(g.job.error||'生成已停止或逾時；請查看保留的配置');const item=g.items.find(x=>x.job===id);if(!item)throw Error('沒有可套用的配置');await enterScene(item.id)}
async function enterScene(id){$('status').textContent='檢查場景並進入…';await post('/apply',{id});await post('/forge/opening',{id});$('status').textContent='已進入 · 回到 Moonlight 操作'}
function video(t){const v=$('video');v.src=`/theme-media/${t.id}/${$('view').value}.mp4`;$('videoTitle').textContent=t.title+' · '+($('view').value==='first'?'第一人稱':'第三人稱');$('player').showModal();v.play().catch(()=>{})}
function cards(){const root=$('cards');root.replaceChildren();for(const t of catalogue){const c=document.createElement('article');c.className='card';const picture=document.createElement('div');picture.className='image';const img=document.createElement('img');img.src=`/theme-media/${t.id}/${$('view').value}.jpg`;img.alt=t.title;img.loading='lazy';picture.append(img);const h=document.createElement('h2');h.textContent=t.title;picture.append(h);const row=document.createElement('div');row.className='actions';const play=document.createElement('button');play.textContent='觀看影片';play.onclick=()=>video(t);const enter=document.createElement('button');enter.className='primary';enter.dataset.requiresWorld='';enter.textContent='進入情境';enter.onclick=()=>action(()=>build(t.id,Number($('seed').value),'home',1,true));row.append(play,enter);c.append(picture,row);root.append(c)}}
function choose(){const t=catalogue.find(x=>x.id===$('theme').value);if(t)$('prompt').value=t.prompt}
$('theme').onchange=choose;$('view').onchange=cards;$('close').onclick=()=>{$('video').pause();$('player').close()};$('player').onclose=()=>$('video').pause();
$('generate').onclick=()=>action(()=>build($('theme').value,Number($('seed').value),'micro',1,true));
$('next').onclick=()=>action(async()=>{$('seed').value=Number($('seed').value)+1;await build($('theme').value,Number($('seed').value),'micro',1,true)});
$('batch').onclick=()=>action(()=>build($('theme').value,Number($('seed').value),'micro',10));
$('stop').onclick=()=>post('/forge/stop').catch(e=>$('error').textContent=e.message);
$('opening').onclick=()=>action(()=>post('/forge/opening',{id:state.authoring?.id}));
async function poll(){try{state=await getState();const f=state.forge;if(!catalogue.length){catalogue=f.catalogue;for(const t of catalogue){const o=document.createElement('option');o.value=t.id;o.textContent=t.title;$('theme').append(o)}choose();cards()}
const j=f.job;if(['building','stopping'].includes(j.status))$('status').textContent=(j.status==='stopping'?'完成當前請求後停止':'產生變體中')+` · ${j.completed}/${j.count}`;else if(!busy)$('status').textContent=!state.ready?'請先在 Moonlight 開啟 VISTA Six Rooms Live AI':state.authoring?.status==='applied'?'場景已就緒 · Moonlight 可操作':'選一個情境開始';
if(j.status==='failed')$('error').textContent=j.error;$('opening').disabled=!state.authoring?.theme_id;
const signature=f.items.map(x=>x.id).join();if(signature!==rendered){rendered=signature;const box=$('variants');box.replaceChildren();for(const item of [...f.items].reverse().slice(0,12)){const b=document.createElement('button');b.className='variant';b.dataset.requiresWorld='';b.textContent=item.title+' · '+item.seed;const s=document.createElement('span');s.textContent=item.recipe?`${({lounge:'客廳',study:'書房',bedroom:'臥室'})[item.recipe.family]}／${({oak:'淺木地板',walnut:'深木地板',stone:'磨石地板'})[item.recipe.palette]}／${item.recipe.lighting==='warm'?'暖光':'日光'}`:'六房情境';b.append(s);b.onclick=()=>action(()=>enterScene(item.id));box.append(b)}}
for(const button of document.querySelectorAll('[data-requires-world],#generate,#next'))button.disabled=!state.ready||busy;
$('debug').textContent=JSON.stringify({job:j,selected:state.authoring?.id,native:state.native,budget:state.budget},null,2);
}catch(e){$('status').textContent='尚未連線'}setTimeout(poll,1200)}poll();
</script></html>
